spring.application.name=cobrancaifmt

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cobrancaifmt?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração explícita para evitar o erro de Dialeto
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3306/cobrancaifmt?useSSL=false&serverTimezone=UTC

# Configuração do Hibernate e DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

@Bean
public LocaleResolver localeResolver(){
return new FixedLocaleResolver(new Locale("pt", "BR"));
}